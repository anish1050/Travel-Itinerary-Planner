    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>WanderCraft - Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap');

        body {
            font-family: 'Poppins', sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        .navbar {
            padding: 0;
            width: 100%;
        }

        .container-fluid {
            padding: 0;
            position: relative;
        }

        #logovideo {
            height: 200px;
            width: 250px;
        }

        .navbar-brand.logo-container {
            padding: 0;
            margin: 0;
        }

        .brand-text {
            position: absolute;
            left: 50%;
            transform: translateX(-50%);
            font-size: 1.5rem;
            font-weight: 500;
        }

        .l_container {
            flex: 1;
            display: flex;
            justify-content: center;
            align-items: center;
            margin-top: -100px;
        }

        .l_page {
            border: 2px solid black;
            border-radius: 10px;
            padding: 2rem 3rem;
            text-align: center;
            width: 300px;
        }

        .l_page input {
            width: 100%;
            margin: 0.5rem 0;
            padding: 0.5rem;
            border: none;
            border-bottom: 2px solid black;
            font-family: 'Poppins', sans-serif;
        }

        .l_page button {
            font-family: 'Poppins', sans-serif;
            margin: 1rem 0;
            border-radius: 10px;
            width: 100px;
            height: 35px;
            cursor: pointer;
            background-color: #007bff;
            color: white;
            border: none;
        }

        .l_page h2 {
            margin-bottom: 1.5rem;
        }

        .l_page h4 {
            margin-top: 1rem;
            margin-bottom: 0.5rem;
        }
        button.l_button{
        
        background-color: beige;
        color: black;
        border: 2px solid black;
        
         }
    </style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container-fluid">
            <a class="navbar-brand logo-container" href="HomePage.html">
                <video id="logovideo" src="Yellow and Green Island Flat Illustrative Hotels and Travel Service Animated Logo.mp4" autoplay muted></video>
            </a>
            <span class="brand-text">WanderCraft</span>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                
            </div>
        </div>
    </nav>

    <div class="l_container">
        <div class="l_page">
            <h4>Login Page</h4>
            <form action="User_Authentication" method="post">
                <input id="u_name" type="text" name="log_username" placeholder="Enter Your Username">
                <input id="passwd" type="password" name="log_password" placeholder="Enter Your Password">
                <button class="l_button">Login</button>
            </form>
            <h5>New User?</h5>
            <a href="RegistrationPage.html">register here</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
