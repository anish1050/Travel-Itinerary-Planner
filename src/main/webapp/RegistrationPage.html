<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>WanderCraft Registration</title>
<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">

<style>
@import url('https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap');

body {
    font-family: 'Poppins';
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
}

.navbar {
    width: 100%;
}

.navbar-brand {
    display: flex;
    align-items: center;
}

.brand-text {
    font-weight: 600;
    font-size: 1.5rem;
    margin-left: 90%;
    
}

#logovideo {
    height: 200px;
    width: 250px;
}

.main-content {
    flex: 1;
    display: flex;
    justify-content: center;
    align-items: center;
    padding: 20px;
}

.r_container {
    border: 2px solid black;
    border-radius: 10px;
    padding: 30px 60px;
    max-width: 500px;
    width: 100%;
}

input {
    font-family: 'Poppins', sans-serif;
    width: 100%;
    margin-bottom: 15px;
    border: none;
    border-bottom: 2px solid black;
    padding: 8px 0;
    outline: none;
}

.r_button {
    font-family: 'Poppins', sans-serif;
    display: block;
    margin: 25px auto;
    border-radius: 10px;
    width: 150px;
    height: 40px;
    cursor: pointer;
    background-color: beige;
    border: 2px solid black;
}

h4 {
    text-align: center;
    margin-top: 30px;
}

.login-link {
    display: block;
    text-align: center;
    text-decoration: none;
    margin-top: 10px;
    color: #0d6efd;
}

.login-link:hover {
    text-decoration: underline;
}

select#securityq{

border: 0px;

}
</style>
</head>

<body>
    <nav class="navbar navbar-expand-lg navbar-light bg-light">
        <div class="container">
            <a class="navbar-brand" href="#">
                <video id="logovideo" src="Yellow and Green Island Flat Illustrative Hotels and Travel Service Animated Logo.mp4" autoplay muted></video>
                <span class="brand-text">WanderCraft</span>
            </a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                <span class="navbar-toggler-icon"></span>
            </button>
        </div>
    </nav>

    <div class="main-content">
        <div class="r_container">
            <h2 class="text-center mb-4">Registration Page</h2>
            <form action="User_Registration" method="post">
                <input id="f_name" type="text" name="reg_fname" placeholder="Enter Your First Name" required>
                <input id="l_name" type="text" name="reg_lname" placeholder="Enter Your Last Name" required>
                <input id="u_name" type="text" name="reg_username" placeholder="Enter Your Username" required>
                <input id="passwd" type="password" name="reg_password" placeholder="Enter Your Password" required>
                <input id="email" type="email" name="reg_email" placeholder="Enter Your Email" required>
                <input id="p_number" type="tel" name="reg_pnumber" placeholder="Enter Your Phone Number" required>
				
				<br>
              <select id="securityq" name="security_question" required>
                <option value="">Select a Security Question</option>
                <option value="What is your pet's name?">What is your pet's name?</option>
                <option value="What city were you born in?">What city were you born in?</option>
                <option value="What is your mother's maiden name?">What is your mother's name?</option>
              </select>
              
              <input type="text" name="security_answer" placeholder="Your Answer" required>
              
              <br>
                <button type="submit" class="r_button">Register</button>
            </form>
            
            <a href="ForgotPassword.html" class="login-link">Forgot Password?</a>
            <h4>Already a user?</h4>
            <a href="LoginPage.html" class="login-link">Login here</a>
        </div>
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
</body>

</html>
