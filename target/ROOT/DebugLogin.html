<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Debug Login - WanderCraft</title>
<link
	href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
	rel="stylesheet">
<style>
@import
	url('https://fonts.googleapis.com/css2?family=Poppins:wght@100;200;300;400;500;600;700;800;900&display=swap')
	;

body {
	font-family: 'Poppins', sans-serif;
	background: linear-gradient(135deg, #f8f9fa 0%, #e9ecef 100%);
	min-height: 100vh;
	display: flex;
	align-items: center;
	justify-content: center;
}

.debug-container {
	background: white;
	padding: 40px;
	border-radius: 15px;
	border: 2px solid #333;
	box-shadow: 0 10px 30px rgba(0, 0, 0, 0.1);
	max-width: 500px;
	width: 100%;
}

.form-group {
	margin-bottom: 20px;
}

label {
	font-weight: 600;
	margin-bottom: 8px;
	display: block;
}

input, select {
	width: 100%;
	padding: 12px;
	border: 2px solid #ddd;
	border-radius: 8px;
	font-family: 'Poppins', sans-serif;
}

.btn-debug {
	background: beige;
	border: 2px solid #333;
	color: #333;
	padding: 12px 30px;
	border-radius: 10px;
	font-weight: 600;
	cursor: pointer;
	transition: all 0.3s ease;
}

.btn-debug:hover {
	background: #333;
	color: beige;
}

.quick-test {
	background: #f8f9fa;
	padding: 20px;
	border-radius: 10px;
	margin-top: 20px;
}

.quick-test h5 {
	margin-bottom: 15px;
	color: #333;
}

.user-btn {
	background: #e9ecef;
	border: 1px solid #333;
	padding: 8px 15px;
	margin: 5px;
	border-radius: 5px;
	cursor: pointer;
	font-size: 0.9rem;
}

.user-btn:hover {
	background: #333;
	color: white;
}
</style>
</head>
<body>
	<div class="debug-container">
		<h2 style="text-align: center; margin-bottom: 30px; color: #333;">🐛
			Debug Login</h2>

		<form action="Debug_Authentication" method="post">
			<div class="form-group">
				<label for="username">Username:</label> <input type="text"
					id="username" name="log_username" required>
			</div>

			<div class="form-group">
				<label for="password">Password:</label> <input type="password"
					id="password" name="log_password" required>
			</div>

			<div style="text-align: center;">
				<button type="submit" class="btn-debug">🔍 Debug Login</button>
			</div>
		</form>

		<div class="quick-test">
			<h5>Quick Test with Database Users:</h5>
			<p style="font-size: 0.9rem; color: #666;">Click to auto-fill
				credentials from your database:</p>

			<button class="user-btn" onclick="fillUser('abhi', '123')">User:
				abhi</button>
			<button class="user-btn" onclick="fillUser('anish', '123')">User:
				anish</button>
			<button class="user-btn" onclick="fillUser('sufi', '123')">User:
				sufi</button>
			<button class="user-btn" onclick="fillUser('test', '1234')">User:
				test</button>
		</div>

		<div style="text-align: center; margin-top: 20px;">
			<a href="LoginPage.html" style="color: #666; text-decoration: none;">←
				Back to Normal Login</a>
		</div>
	</div>

	<script>
        function fillUser(username, password) {
            document.getElementById('username').value = username;
            document.getElementById('password').value = password;
        }
    </script>
</body>
</html>
